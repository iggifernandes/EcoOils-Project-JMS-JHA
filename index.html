<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JMS &amp; JHA Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--red:#DD1D21;--yel:#FBCE07;--ink:#262626;--grey:#6b6b6b;--line:#d9d9d9;--bg:#f6f6f4;--card:#fff;--green:#4d9a2c;--ok:#2e7d32}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Jost,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:#fff;border-bottom:3px solid var(--yel);display:flex;align-items:center;gap:16px;padding:10px clamp(12px,3vw,32px);flex-wrap:wrap}
.brand{width:120px;flex:none}
.brand img{width:100%;display:block}
.brand svg{width:100%;height:16px;display:block;margin-top:1px}
.ttl{flex:1;min-width:180px}
.ttl h1{margin:0;font-weight:300;text-transform:uppercase;letter-spacing:.22em;color:var(--grey);font-size:clamp(15px,2.2vw,22px)}
.ttl small{color:var(--grey);letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#ver{font-size:11px;color:var(--grey);letter-spacing:.08em}
.lang{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.lang button{background:#fff;border:0;padding:4px 10px;cursor:pointer;font-size:12px;letter-spacing:.08em}
.lang button.on{background:var(--ink);color:#fff}
nav.tabs{display:flex;gap:2px;padding:0 clamp(12px,3vw,32px);background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px;cursor:pointer;text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--grey);white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-color:var(--red)}
main{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:18px;padding:18px clamp(12px,3vw,32px);align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px}
.card h2{margin:0 0 10px;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.16em;color:var(--grey)}
.btn{border:1px solid var(--ink);background:#fff;padding:7px 14px;border-radius:4px;cursor:pointer;font-size:13px;letter-spacing:.04em}
.btn:hover{background:#f0f0f0}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:#b91519}
.btn.dk{background:var(--ink);color:#fff}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.del{border-color:#c33;color:#c33}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:60vh;overflow:auto}
.item{border:1px solid var(--line);border-radius:5px;padding:8px 10px;cursor:pointer;background:#fff}
.item.on{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.item b{font-weight:500}.item small{display:block;color:var(--grey)}
.chip{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:1px 7px;border-radius:9px;margin-left:6px;vertical-align:middle}
.chip.draft{background:#fff3c4;color:#7a5c00}.chip.issued{background:#dff0e0;color:var(--ok)}
.grid{display:grid;gap:10px}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
div.f,label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--grey);letter-spacing:.04em}
label.f.wide,div.f.wide{grid-column:1/-1}
.in{border:1px solid var(--line);border-radius:4px;padding:7px 9px;background:#fff;width:100%;font-size:14px;color:var(--ink)}
textarea.in{resize:vertical;min-height:60px}
.in:focus{outline:2px solid var(--yel);border-color:var(--ink)}
.sec{margin-top:16px;border-top:2px solid var(--ink);padding-top:10px}
.sec>h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.14em;font-weight:500}
.sec>h3 small{color:var(--grey);font-weight:300;letter-spacing:.06em;text-transform:none;margin-left:8px}
.ram{display:flex;gap:0;border:1px solid var(--ink);margin-top:6px;max-width:460px}
.ram div{flex:1;text-align:center;padding:9px 4px;font-size:12px;opacity:.28;font-weight:500}
.ram div.on{opacity:1;outline:3px solid var(--ink);outline-offset:-3px}
.ram .l1{background:#9dc3e6}.ram .l2{background:#0070c0;color:#fff}.ram .m{background:#ffff00}.ram .h{background:#ff0000;color:#fff}
.steps{display:flex;flex-direction:column;gap:10px}
.step{border:1px solid var(--line);border-radius:6px;padding:10px;background:#fcfcfb}
.step .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.step .no{background:var(--ink);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:12px;flex:none}
.cats{position:relative}
.cats summary{list-style:none;cursor:pointer;min-height:36px}
.cats summary::-webkit-details-marker{display:none}
.cats .pop{position:absolute;z-index:5;background:#fff;border:1px solid var(--ink);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:5px;min-width:200px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.cats .pop label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink)}
.lsr{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.lsr label,.psf label{border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;cursor:pointer;font-size:12px;background:#fff}
.lsr label.on,.psf label.on{border-color:var(--red);background:#fff6f6}
.lsr img{width:62px;height:62px;object-fit:contain}
.psf{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.psf label{flex-direction:row;text-align:left;align-items:center;font-size:13px}
.psf img{width:44px;height:44px;object-fit:contain;flex:none}
.sig{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.sig>div{border:1px solid var(--line);padding:8px;border-radius:5px}
.sig b{font-size:12px;font-weight:500;display:block;margin-bottom:6px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{border:1px solid var(--line);padding:4px 6px;text-align:left}
table.t th{background:#f0f0ee;font-weight:500;font-size:12px}
.dz{border:2px dashed var(--line);border-radius:6px;padding:14px;text-align:center;color:var(--grey);cursor:pointer}
.dz.over{border-color:var(--red);background:#fff6f6}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.thumb{position:relative;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff}
.thumb img{width:100%;height:100px;object-fit:cover;display:block;cursor:zoom-in}
.thumb input{border:0;border-top:1px solid var(--line);width:100%;padding:4px 6px;font-size:12px}
.thumb button{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer}
#peek{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
#peek.on{display:flex}
#peek img{max-width:100%;max-height:100%;border-radius:4px;background:#fff}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:5px;font-size:13px;z-index:100;display:none;max-width:90vw}
.bar{position:sticky;top:0;z-index:4;background:var(--card);margin:-14px -14px 12px;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-radius:6px 6px 0 0}
.bar .grow{flex:1;min-width:120px}
.revbox{font-size:12px;color:var(--grey)}
.revbox b{color:var(--ink);font-weight:500}
.ref img{max-width:100%;border:1px solid var(--line);border-radius:4px;background:#fff}
.hide{display:none!important}
.empty{color:var(--grey);text-align:center;padding:40px 10px}
#printArea{display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:98;padding:16px}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:8px;padding:18px;width:min(440px,100%);max-height:92vh;overflow:auto}
.banner{background:#fff3c4;border:1px solid #e0b800;border-radius:6px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner b{font-weight:500}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#bbb;margin-right:6px}
.dot.ok{background:#2e7d32}.dot.err{background:#c62828}.dot.login{background:#e0a800}
.cb{display:flex;flex-wrap:wrap;gap:6px 12px}.cb label{display:flex;gap:5px;align-items:center;font-size:13px}
/* ---------- PRINT FORMS ---------- */
@media print{
  body{background:#fff}
  header.top,nav.tabs,main,#toast,#peek{display:none!important}
  #printArea{display:block}
}
.pf{font-family:Arial,Helvetica,sans-serif;color:#000;font-size:9pt}
.pf table{border-collapse:collapse;width:100%}
.pf td,.pf th{border:1px solid #000;padding:3px 5px;vertical-align:top}
.pf .bl{color:#0070c0}
.pf .c{text-align:center}
.pf .b{font-weight:700}
.pf .nb td,.pf .nb th{border:0}
.pf .pb{page-break-before:always;break-before:page}
.pf .ph{display:flex;justify-content:space-between;font-size:8pt;margin-bottom:3px}
.pf .logo{height:30px}
.pf .jhahead td{height:30px}
.pf table.jt td{padding:2px 4px;font-size:8.5pt}
.pf .rowh td{height:15mm}
.pf .tick{display:inline-block;width:11px;height:11px;border:1.4px solid #000;text-align:center;line-height:10px;font-size:10px;vertical-align:middle;margin-right:4px}
.pf .lsrg{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;text-align:center;font-size:7.5pt;padding:6px 2px;border:1px solid #000;border-top:0}
.pf .lsrg img{width:46px;height:46px;object-fit:contain;display:block;margin:0 auto 2px}
.pf .psfg{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:8.5pt;padding:6px;border:1px solid #000;border-top:0}
.pf .psfg div{display:flex;gap:6px;align-items:center}
.pf .psfg img{width:30px;height:30px;object-fit:contain}
.pf .sigt td{border:0;height:19px}
.pf .sigl{border-bottom:1px solid #000!important}
.pf .ramp{display:flex;height:100%;min-height:30px}
.pf .ramp div{flex:1;display:grid;place-items:center;font-size:8pt;font-weight:700}
.pf .wm{font-weight:700;text-align:center}
.pf .att{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px}
.pf .att figure{margin:0}
.pf .att img{width:100%;max-height:75mm;object-fit:contain;border:1px solid #888}
.pf .att figcaption{font-size:8pt;text-align:center}
.pf .draft{position:fixed;top:45%;left:0;right:0;text-align:center;font-size:90pt;color:rgba(200,0,0,.08);transform:rotate(-25deg);pointer-events:none;font-weight:700}
</style>
</head>

</nav>

<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="filePick" accept="image/*" multiple class="hide">
<input type="file" id="importPick" accept="application/json" class="hide">

/* ---------------- storage (IndexedDB with in-memory fallback) ---------------- */
let DB=null, MEM=[];
function idb(){return new Promise(res=>{try{const r=indexedDB.open('jms_jha_builder',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs',{keyPath:'id'});r.onsuccess=()=>{DB=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function allDocs(){return new Promise(res=>{if(!DB)return res(MEM.slice());const q=DB.transaction('docs').objectStore('docs').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res([])})}
function putDoc(d){return new Promise(res=>{if(!DB){const i=MEM.findIndex(x=>x.id===d.id);i<0?MEM.push(d):MEM[i]=d;return res()}const tx=DB.transaction('docs','readwrite');tx.objectStore('docs').put(d);tx.oncomplete=()=>res();tx.onerror=()=>res()})}
function delDoc(id){return new Promise(res=>{if(!DB){MEM=MEM.filter(x=>x.id!==id);return res()}const tx=DB.transaction('docs','readwrite');tx.objectStore('docs').delete(id);tx.oncomplete=()=>res()})}
let DOCS=[];

/* ---------------- model ---------------- */
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
function nextRef(type){const p=type==='jha'?'JHA':'JMS';const n=DOCS.filter(d=>d.type===type).map(d=>parseInt(d.ref.split('-').pop(),10)||0);return p+'-'+String((n.length?Math.max(...n):0)+1).padStart(4,'0')}
function blankJha(){return{facility:'',location:'',task:'',ptw:'',service:'',temp:'',press:'',sev:{P:0,A:0,C:0,E:0},like:'A',

 sign:{coord:{name:'',dt:''},owner:{name:'',dt:''},hod:{name:'',dt:''},hsse:{name:'',dt:''}},lsr:[],lsrNotes:'',psf:[],psfNotes:''}}

function newDoc(type){
  const d={id:uid(),type,ref:nextRef(type),rev:0,status:'draft',date:today(),revDate:today(),revReason:'',updated:Date.now(),data:type==='jha'?blankJha():blankJms(),history:[]};
  return d}
const revStr=n=>String(n).padStart(2,'0');
function titleOf(d){return d.type==='jha'?(d.data.task||'(untitled JHA)'):(d.data.title||'(untitled JMS)')}

/* revision engine: editing an issued document automatically opens the next revision */
function touch(){
  const d=CUR; if(!d)return;
  if(d.status==='issued'){
    d.rev+=1; d.status='draft'; d.revDate=today(); d.revReason=''; d.date=today();
    toast(t('autoRev')+t('rev')+' '+revStr(d.rev)); renderBar();
  }
  d.updated=Date.now(); clearTimeout(touch._t); touch._t=setTimeout(()=>putDoc(d).then(()=>{const s=document.getElementById('savedAt');if(s)s.textContent=t('save')+' '+new Date().toLocaleTimeString();pushDoc(d)}),350);
  const dateIn=document.querySelector('[data-p="dateTop"]'); if(dateIn&&dateIn.value!==d.date)dateIn.value=d.date;
  renderSide(true);
}
function issue(){
  const d=CUR; if(!d||d.status==='issued')return;
  let reason='';
  if(d.rev===0)reason=t('initial'); else{reason=prompt(t('reasonAsk'),d.revReason||'');if(reason===null)return;if(!reason.trim())return}
  d.status='issued'; d.revReason=reason; d.date=today(); d.revDate=today();
  d.history=d.history.filter(h=>h.rev!==d.rev);
  d.history.push({rev:d.rev,date:today(),reason,by:ls('jj_author')||'',data:clone(d.data),meta:{ref:d.ref},lessons:matched(d.type,d.data).map(l=>({id:l.id,title:l.title,source:l.source,lesson:l.lesson,action:l.action,date:l.date}))});
  putDoc(d).then(()=>{pushDoc(d,true);toast(t('issuedMsg')+' '+revStr(d.rev));renderBar();renderSide(true);renderRevTable()});
}

/* ---------------- helpers ---------------- */
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',3200)}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
function get(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function set(o,p,v){const ks=p.split('.');const l=ks.pop();const r=ks.reduce((a,k)=>a[k],o);r[l]=v}
function maxSev(s){return Math.max(s.P,s.A,s.C,s.E)}
function ramClass(s,l){return RAMM[maxSev(s)][LIKE.indexOf(l)]}
function sevLabel(s){const m=maxSev(s);const k=m===0?'P':['P','A','C','E'].find(x=>s[x]===m);return 'P'+s.P+' A'+s.A+' C'+s.C+' E'+s.E+(m?'':'')}
function fmtDate(s){if(!s)return '';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y}

/* ---------------- sidebar ---------------- */
function renderSide(light){
  const side=document.getElementById('side');

  <label class="f" style="margin-top:10px">${t('author')}<input class="in" id="author" value="${esc(ls('jj_author')||'')}"></label>
  <div class="list">${listHtml(list)}</div>
  <div class="row" style="margin-top:12px"><button class="btn sm" id="bExp">${t('export')}</button><button class="btn sm" id="bImp">${t('import')}</button></div>

  <div class="sec"><h3>${t('verifyT')}</h3><div class="row" style="flex-wrap:nowrap"><input class="in" id="vRef" placeholder="JHA-0001"><input class="in" id="vRev" placeholder="00" style="width:64px"><button class="btn sm" id="vGo">${t('verifyBtn')}</button></div><div id="vOut" style="margin-top:6px;font-size:13px"></div></div>`;
  renderSyncBox();document.getElementById('vGo').onclick=verifyCopy;

function listHtml(list){
  if(!list.length)return `<div class="empty">${t('none')}</div>`;

function F(label,path,opt={}){const v=get(CUR.data,path);const tag=opt.area?`<textarea class="in" data-p="${path}" rows="${opt.rows||3}">${esc(v)}</textarea>`:`<input class="in" data-p="${path}" value="${esc(v)}" ${opt.ph?`placeholder="${opt.ph}"`:''}>`;return `<label class="f ${opt.wide?'wide':''}">${label}${tag}</label>`}

  box.querySelectorAll('.step').forEach(el=>{const i=+el.dataset.i,s=d.steps[i];

function drawThumbs(){
  const d=CUR.data,box=document.getElementById('thumbs');
  box.innerHTML=d.photos.map((p,i)=>`<div class="thumb"><img src="${p.src}" data-pk="${i}" alt=""><button data-rm="${i}" title="${t('remove')}">✕</button><input placeholder="${t('caption')}" data-cap="${i}" value="${esc(p.cap)}"></div>`).join('')+`<div class="thumb" style="display:grid;place-items:center;min-height:100px;cursor:pointer;font-size:34px;color:#999" id="plus">+</div>`;
  box.querySelectorAll('[data-pk]').forEach(i=>i.onclick=()=>peek(d.photos[+i.dataset.pk].src));
  box.querySelectorAll('[data-cap]').forEach(i=>i.oninput=()=>{d.photos[+i.dataset.cap].cap=i.value;touch()});
  box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{d.photos.splice(+b.dataset.rm,1);drawThumbs();touch()});
  document.getElementById('plus').onclick=()=>document.getElementById('filePick').click();
}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=1400,s=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.onerror=()=>res(null);im.src=r.result};r.readAsDataURL(file)})}
async function addFiles(files){
  if(!CUR||CUR.type!=='jms')return;
  for(const f of files){if(!f.type.startsWith('image/'))continue;const src=await shrink(f);if(src)CUR.data.photos.push({src,cap:''})}
  drawThumbs();touch();
}
document.getElementById('filePick').onchange=e=>{addFiles(e.target.files);e.target.value=''};
function peek(src){const p=document.getElementById('peek');p.querySelector('img').src=src;p.classList.add('on')}
document.getElementById('peek').onclick=()=>document.getElementById('peek').classList.remove('on');
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('peek').classList.remove('on')});

  <tr><td colspan="2"><b>Attachments (photographs, sketches, flow charts etc.)</b></td></tr>
  <tr><td colspan="2" style="padding:0;height:${d.photos.length?'auto':'30mm'}">${d.photos.length?`<div class="att">${d.photos.map(p=>`<figure><img src="${p.src}" alt=""><figcaption>${esc(p.cap)}</figcaption></figure>`).join('')}</div>`:''}</td></tr></table>
  ${lessonsPrint()}${doc.history.length?`<table style="margin-top:8px;font-size:8pt"><tr class="b"><td colspan="4">Revision history</td></tr><tr class="b"><td>Rev</td><td>Date</td><td>By</td><td>Reason</td></tr>${doc.history.slice().sort((a,b)=>a.rev-b.rev).filter(h=>h.rev<=rev).map(h=>`<tr><td>${revStr(h.rev)}</td><td>${fmtDate(h.date)}</td><td>${esc(h.by)}</td><td>${esc(h.reason)}</td></tr>`).join('')}</table>`:''}`;
}
function jhaRevTable(doc,rev){
  const h=doc.history.filter(x=>x.rev<=rev).sort((a,b)=>a.rev-b.rev);
  return h.length?`<table style="margin-top:6px;font-size:8pt"><tr class="b"><td colspan="4">Revision history / Sejarah semakan</td></tr><tr class="b"><td style="width:6%">Rev</td><td style="width:12%">Date</td><td style="width:20%">By</td><td>Reason</td></tr>${h.map(x=>`<tr><td>${revStr(x.rev)}</td><td>${fmtDate(x.date)}</td><td>${esc(x.by)}</td><td>${esc(x.reason)}</td></tr>`).join('')}</table>`:''}
function doPrint(doc,data,rev,date,status,les){
  PRINT_LES=les||[];
  const pa=document.getElementById('printArea');
  pa.innerHTML=(doc.type==='jha'?printJha(doc,data,rev,date,status)+jhaRevTable(doc,rev):printJms(doc,data,rev,date,status))+`<div style="font-size:7pt;margin-top:5px;color:#444">${esc(doc.ref)} · REV ${revStr(rev)} · ${t('printedFoot')} · ${fmtDate(today())}</div>`;
  let st=document.getElementById('pgStyle');if(!st){st=document.createElement('style');st.id='pgStyle';document.head.appendChild(st)}
  st.textContent=`@page{size:A4 ${doc.type==='jha'?'landscape':'portrait'};margin:${doc.type==='jha'?'8mm':'12mm'}}`;
  const old=document.title;document.title=doc.ref+'_Rev'+revStr(rev);
  setTimeout(()=>{window.print();document.title=old},150);
}

/* ---------------- lessons learned: matching, auto-attach, tab ---------------- */
let LESSONS=[];try{LESSONS=JSON.parse(ls('jj_lessons')||'[]')}catch(e){}
function saveLessonsLocal(){ls('jj_lessons',JSON.stringify(LESSONS))}
function docText(type,d){
  const a=type==='jha'?[d.task,d.facility,d.location,d.service].concat(d.steps.flatMap(s=>[s.task,s.tools,s.hazard,s.control])):[d.title,d.desc,d.location].concat(d.equip,d.steps);
  return a.join(' ').toLowerCase()}
function matchedAll(type,d){
  const txt=docText(type,d),cats=new Set(type==='jha'?d.steps.flatMap(s=>s.cats):[]),lsr=type==='jha'?d.lsr:[];
  return LESSONS.filter(l=>l.active!==false&&((l.categories||[]).some(c=>cats.has(c))||(l.lsr||[]).some(n=>lsr.includes(n))||(l.keywords||[]).some(k=>k&&txt.includes(String(k).toLowerCase())))).sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function matched(type,d){const ex=d.lessonsExcluded||[];return matchedAll(type,d).filter(l=>!ex.includes(l.id))}
const sigL=a=>a.map(l=>l.id+':'+String(l.lesson||'').length+String(l.action||'').length).sort().join('|');
function pendingLessons(d){
  if(d.status!=='issued')return false;
  const h=d.history.find(x=>x.rev===d.rev);if(!h)return false;
  return sigL(matched(d.type,d.data))!==sigL(h.lessons||[])}
function startRevision(reason){
  const d=CUR;if(!d||d.status!=='issued')return;
  d.rev+=1;d.status='draft';d.revDate=today();d.date=today();d.revReason=reason||'';d.updated=Date.now();
  putDoc(d).then(()=>pushDoc(d));renderBar();renderPending();renderLesPanel();renderSide(true);
  const dt=document.querySelector('[data-p="dateTop"]');if(dt)dt.value=d.date;
  toast(t('rev')+' '+revStr(d.rev))}
function renderPending(){
  const e=document.getElementById('pend');if(!e||!CUR)return;
  if(!pendingLessons(CUR)){e.innerHTML='';return}
  const h=CUR.history.find(x=>x.rev===CUR.rev),old=new Set((h.lessons||[]).map(l=>l.id));
  const fresh=matched(CUR.type,CUR.data).filter(l=>!old.has(l.id)).map(l=>l.title);
  e.innerHTML=`<div class="banner"><div style="flex:1"><b>${t('lesPending')}</b>${fresh.length?'<br><small>'+esc(fresh.join(' · '))+'</small>':''}</div><button class="btn dk" id="bStartRev">${t('lesStart')}</button></div>`;
  document.getElementById('bStartRev').onclick=()=>startRevision('Lessons learned updated'+(fresh.length?': '+fresh.join('; '):''))}
function renderLesPanel(){
  const e=document.getElementById('lesP');if(!e||!CUR)return;
  const ex=CUR.data.lessonsExcluded||[],all=matchedAll(CUR.type,CUR.data);
  e.innerHTML=all.length?all.map(l=>`<label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px"><input type="checkbox" data-ex="${esc(l.id)}" ${ex.includes(l.id)?'':'checked'}><span><b style="font-weight:500">${esc(l.title)}</b> <small style="color:#777">${esc(l.source)} ${esc(l.date)}</small><br>${esc(l.lesson)}${l.action?'<br><i>→ '+esc(l.action)+'</i>':''}</span></label>`).join(''):`<span class="revbox">${t('lesNone')}</span>`;
  e.querySelectorAll('[data-ex]').forEach(c=>c.onchange=()=>{
    const a=CUR.data.lessonsExcluded=CUR.data.lessonsExcluded||[],id=c.dataset.ex,i=a.indexOf(id);
    c.checked?(i>=0&&a.splice(i,1)):(i<0&&a.push(id));touch();renderPending()})}
let LES_EDIT=null;
function renderLessons(){
  const ed=document.getElementById('editor'),l=LES_EDIT||{id:'',date:today(),title:'',source:'',categories:[],lsr:[],keywords:[],lesson:'',action:''};
  const list=LESSONS.filter(x=>x.active!==false).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  ed.innerHTML=`<h2>${LES_EDIT?t('lesEdit'):t('lesAdd')}</h2>
  <div class="grid g3"><label class="f">${t('date')}<input class="in" type="date" id="lDate" value="${esc(l.date)}"></label><label class="f">${t('lesSource')}<input class="in" id="lSrc" value="${esc(l.source)}"></label><label class="f wide">${t('lesTitle')}<input class="in" id="lTitle" value="${esc(l.title)}"></label>
  <div class="f wide">${t('lesCats')}<div class="cb">${HCATS.map(h=>`<label><input type="checkbox" data-lc="${h}" ${l.categories.includes(h)?'checked':''}>${h}</label>`).join('')}</div></div>
  <div class="f wide">${t('lesLsr')}<div class="cb">${LSR.map((x,i)=>`<label><input type="checkbox" data-ll="${i+1}" ${l.lsr.includes(i+1)?'checked':''}>${i+1}. ${x[0]}</label>`).join('')}</div></div>
  <label class="f wide">${t('lesKeys')}<input class="in" id="lKeys" value="${esc((l.keywords||[]).join(', '))}"></label>
  <label class="f wide">${t('lesText')}<textarea class="in" id="lText" rows="4">${esc(l.lesson)}</textarea></label>
  <label class="f wide">${t('lesAct')}<textarea class="in" id="lAct" rows="3">${esc(l.action)}</textarea></label></div>
  <div class="row" style="margin-top:10px"><button class="btn pri" id="lSave">${t('lesSave')}</button>${LES_EDIT?`<button class="btn" id="lCancel">${t('close')}</button>`:''}</div>
  <div class="sec"><h3>${t('lesList')} (${list.length})</h3>${list.length?`<table class="t"><tr><th>${t('date')}</th><th>${t('lesTitle')}</th><th>${t('lesCats')}</th><th></th></tr>${list.map(x=>`<tr><td>${fmtDate(x.date)}</td><td><b style="font-weight:500">${esc(x.title)}</b><br><small>${esc(x.source)}</small></td><td>${esc((x.categories||[]).join(', '))}${(x.lsr||[]).length?'<br><small>LSR '+x.lsr.join(', ')+'</small>':''}${(x.keywords||[]).length?'<br><small>'+esc(x.keywords.join(', '))+'</small>':''}</td><td style="white-space:nowrap"><button class="btn sm" data-le="${esc(x.id)}">${t('lesEdit')}</button> <button class="btn sm del" data-lo="${esc(x.id)}">${t('lesOff')}</button></td></tr>`).join('')}</table>`:`<span class="revbox">${t('lesNone')}</span>`}</div>`;
  document.getElementById('lSave').onclick=async()=>{
    const n={id:l.id||('L'+Date.now().toString(36)),date:val('lDate'),title:val('lTitle').trim(),source:val('lSrc').trim(),categories:[...ed.querySelectorAll('[data-lc]:checked')].map(x=>x.dataset.lc),lsr:[...ed.querySelectorAll('[data-ll]:checked')].map(x=>+x.dataset.ll),keywords:val('lKeys').split(',').map(x=>x.trim()).filter(Boolean),lesson:val('lText').trim(),action:val('lAct').trim(),active:true};
    if(!n.title||!n.lesson){toast(t('lesTitle')+' / '+t('lesText'));return}
    const i=LESSONS.findIndex(x=>x.id===n.id);i<0?LESSONS.push(n):LESSONS[i]=n;
    if(syncOn()){const r=await api('lessonSave',{lesson:n});if(!r||!r.ok){n.pending=true}}else n.pending=true;
    saveLessonsLocal();LES_EDIT=null;renderLessons();renderSide(true);toast('OK')};
  const c=document.getElementById('lCancel');if(c)c.onclick=()=>{LES_EDIT=null;renderLessons()};
  ed.querySelectorAll('[data-le]').forEach(b=>b.onclick=()=>{LES_EDIT=clone(LESSONS.find(x=>x.id===b.dataset.le));renderLessons()});
  ed.querySelectorAll('[data-lo]').forEach(b=>b.onclick=async()=>{const x=LESSONS.find(y=>y.id===b.dataset.lo);x.active=false;if(syncOn())api('lessonDelete',{id:x.id});saveLessonsLocal();renderLessons();renderSide(true)})}
const val=id=>document.getElementById(id).value;

/* ---------------- sync with Apps Script backend (optional; app works offline without it) ---------------- */
let URL_=ls('jj_url')||'',TOK=ls('jj_tok')||'',SYNC=URL_?(TOK?'ok':'login'):'off';
const syncOn=()=>!!(URL_&&TOK);
async function api(action,payload){
  const r=await fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:TOK},payload||{}))});
  const j=await r.json();
  if(j&&j.error==='AUTH'){TOK='';ls('jj_tok','');SYNC='login';renderSyncBox()}
  return j}
const PQ={};
function pushDoc(d,now){
  if(!syncOn()||!d)return;
  clearTimeout(PQ[d.id]);
  PQ[d.id]=setTimeout(async()=>{
    try{const r=await api('save',{doc:d});
      if(r&&r.ok){if(r.conflict){await pullAll()}else SYNC='ok'}
      else if(r&&r.error!=='AUTH')SYNC='err';
    }catch(e){SYNC='err'}renderSyncBox()},now?50:1500)}
async function pullAll(){
  if(!syncOn())return;
  try{
    for(const l of LESSONS.filter(x=>x.pending)){const r=await api('lessonSave',{lesson:l});if(r&&r.ok)delete l.pending}
    const lr=await api('lessons');
    if(lr&&lr.ok){const keep=LESSONS.filter(x=>x.pending);LESSONS=lr.lessons.map(x=>Object.assign(x,{active:true})).concat(keep.filter(k=>!lr.lessons.some(x=>x.id===k.id)));saveLessonsLocal()}
    const r=await api('list');if(!r||!r.ok){SYNC=r&&r.error==='AUTH'?'login':'err';renderSyncBox();return}
    for(const m of r.docs){
      const loc=DOCS.find(d=>d.id===m.id);
      if(!loc||m.updated>loc.updated){const g=await api('get',{id:m.id});if(g&&g.ok){const i=DOCS.findIndex(d=>d.id===m.id);i<0?DOCS.push(g.doc):DOCS[i]=g.doc;await putDoc(g.doc);if(CUR&&CUR.id===m.id&&!document.activeElement.closest('#form')){CUR=g.doc;renderEditor()}else if(CUR&&CUR.id===m.id){CUR=g.doc}}}
      else if(loc.updated>m.updated)pushDoc(loc,true)}
    for(const d of DOCS)if(!r.docs.some(m=>m.id===d.id))pushDoc(d,true);
    SYNC='ok'}catch(e){SYNC='err'}
  renderSyncBox();renderSide(true);if(TAB==='les')renderLessons();else{renderPending();renderLesPanel()}}
function renderSyncBox(){
  const b=document.getElementById('syncBox');if(!b)return;
  const msg={off:t('syncOff'),ok:t('syncOk'),err:t('syncErr'),login:t('syncLogin')}[SYNC]||'';
  b.innerHTML=`<div style="font-size:13px"><span class="dot ${SYNC}"></span>${msg}</div><div class="row" style="margin-top:6px"><button class="btn sm" id="bSync">${syncOn()?t('syncNow'):t('login')}</button><button class="btn sm" id="bSet">⚙</button></div>`;
  document.getElementById('bSync').onclick=()=>syncOn()?pullAll():openModal();
  document.getElementById('bSet').onclick=openModal}
function openModal(){
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="box"><h2 style="margin:0 0 10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:#666">${t('sync')}</h2>
  <label class="f">${t('backendUrl')}<input class="in" id="mUrl" value="${esc(URL_)}" placeholder="https://script.google.com/macros/s/…/exec"></label>
  <div class="row" style="margin:6px 0 12px"><button class="btn sm" id="mSaveUrl">${t('saveUrl')}</button></div>
  <div class="grid"><label class="f">${t('email')}<input class="in" id="mEmail" type="email" value="${esc(ls('jj_email')||'')}" autocomplete="username"></label>
  <label class="f">${t('pin')}<input class="in" id="mPin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></label></div>
  <div class="row" style="margin:8px 0"><button class="btn pri" id="mLogin">${t('login')}</button>${TOK?`<button class="btn" id="mOut">${t('logout')}</button>`:''}</div>
  <div class="sec"><h3>${t('forgot')}</h3><div class="row"><button class="btn sm" id="mSend">${t('sendCode')}</button></div>
  <div class="grid" style="margin-top:8px"><label class="f">${t('code')}<input class="in" id="mCode" inputmode="numeric" maxlength="6"></label><label class="f">${t('newPin')}<input class="in" id="mNew" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label></div>
  <div class="row" style="margin-top:8px"><button class="btn sm dk" id="mSet">${t('setPin')}</button></div></div>
  <div id="mMsg" style="margin-top:10px;font-size:13px;color:#555"></div><div class="row" style="margin-top:10px"><button class="btn sm" id="mClose">${t('close')}</button></div></div>`;
  m.classList.add('on');
  const say=x=>document.getElementById('mMsg').textContent=x;
  document.getElementById('mClose').onclick=()=>m.classList.remove('on');
  document.getElementById('mSaveUrl').onclick=()=>{URL_=val('mUrl').trim();ls('jj_url',URL_);SYNC=URL_?(TOK?'ok':'login'):'off';renderSyncBox();say('OK')};
  document.getElementById('mLogin').onclick=async()=>{try{URL_=val('mUrl').trim();ls('jj_url',URL_);const r=await api('login',{email:val('mEmail'),pin:val('mPin')});
    if(r&&r.ok){TOK=r.token;ls('jj_tok',TOK);ls('jj_email',val('mEmail'));if(r.name&&!ls('jj_author'))ls('jj_author',r.name);SYNC='ok';m.classList.remove('on');renderSide();pullAll()}else say(r&&r.message?r.message:'Login failed')}catch(e){say('Cannot reach backend')}};
  const out=document.getElementById('mOut');if(out)out.onclick=()=>{TOK='';ls('jj_tok','');SYNC=URL_?'login':'off';m.classList.remove('on');renderSyncBox()};
  document.getElementById('mSend').onclick=async()=>{try{URL_=val('mUrl').trim();ls('jj_url',URL_);const r=await api('requestReset',{email:val('mEmail')});say(r&&r.ok?t('codeSent'):'Error')}catch(e){say('Cannot reach backend')}};
  document.getElementById('mSet').onclick=async()=>{try{const r=await api('setPin',{email:val('mEmail'),code:val('mCode'),pin:val('mNew')});say(r&&r.ok?t('pinSet'):(r&&r.message)||'Invalid code')}catch(e){say('Cannot reach backend')}}}
async function verifyCopy(){
  const ref=val('vRef').trim().toUpperCase(),rev=parseInt(val('vRev'),10)||0,o=document.getElementById('vOut');
  let st='UNKNOWN';
  if(syncOn()){try{const r=await api('verify',{ref,rev});if(r&&r.ok)st=r.status}catch(e){}}
  if(st==='UNKNOWN'){const d=DOCS.find(x=>x.ref===ref);if(d){const li=d.status==='issued'?d.rev:d.rev-1;st=rev===li?'CURRENT':(rev<li?'SUPERSEDED':'NOT_ISSUED')}}
  const m={CURRENT:['vCurrent','#2e7d32'],SUPERSEDED:['vSuper','#c62828'],NOT_ISSUED:['vNot','#b26a00'],UNKNOWN:['vUnknown','#666']}[st]||['vUnknown','#666'];
  o.textContent=t(m[0]);o.style.color=m[1];o.style.fontWeight='500'}

/* ---------------- chrome ---------------- */
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB));
  document.title=t('title');
  document.getElementById('main').classList.toggle('hide',false);
  document.getElementById('side').classList.toggle('hide',TAB==='ref'||TAB==='les');
  document.getElementById('main').style.gridTemplateColumns=(TAB==='ref'||TAB==='les')?'1fr':'';
}
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;ls('jj_lang',LANG);applyLang();renderSide();renderEditor()});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;ls('jj_tab',TAB);if(CUR&&TAB!=='ref'&&TAB!=='les'&&CUR.type!==TAB)CUR=null;applyLang();document.getElementById('side').dataset.tab='';renderSide();renderEditor()});
document.getElementById('logoImg').src=IMG.logo;
document.getElementById('ver').textContent='v'+VERSION;
(async function init(){
  await idb();DOCS=await allDocs();applyLang();
  const last=DOCS.filter(d=>d.type===TAB).sort((a,b)=>b.updated-a.updated)[0];if(last&&TAB!=='ref'&&TAB!=='les')CUR=last;
  renderSide();renderEditor();
  if(syncOn()){pullAll();setInterval(pullAll,90000)}
})();
window.addEventListener('beforeprint',()=>{});
</script>
